<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, minimum-scale=1.0, shrink-to-fit=no, viewport-fit=cover"
  >

  <title>Whiteout Survival Wiki</title>

  <meta
    name="description"
    content="A community-maintained Whiteout Survival wiki covering heroes, gear, events, alliances, research, pets, experts, and island content."
  >

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"
  >

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse@1.3.5/dist/sidebar.min.css"
  >
</head>

<body>
  <div id="app"></div>

  <script>
    window.$docsify = {
      name: 'Whiteout Survival Wiki',

      auto2top: true,

      loadSidebar: true,

      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },

      maxLevel: 0,
      subMaxLevel: 3,

      sidebarDisplayLevel: 1,

      search: {
        placeholder: 'Search the wiki',
        noData: 'No matches found.',
        depth: 2
      }
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse@1.3.5/dist/docsify-sidebar-collapse.min.js"></script>
</body>
</html>
